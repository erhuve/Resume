name: Render resume

on:
  push:
    branches: [main]
    paths:
      - main.tex
      - scripts/**
      - .github/workflows/resume.yml
  pull_request:
    paths:
      - main.tex
      - scripts/**
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-extra
      - name: Generate README and PDF
        run: |
          python3 scripts/render_readme.py
          mkdir -p build
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- main.tex)"
          export FORCE_SOURCE_DATE=1
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=build main.tex
          cp build/main.pdf 'Luo Raymond Resume.pdf'
      - name: Update generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add README.md 'Luo Raymond Resume.pdf'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name hatsunemiku
          git config user.email hatsunemiku@zo.computer
          export GIT_AUTHOR_NAME=ray.mond
          export GIT_AUTHOR_EMAIL=59463268+erhuve@users.noreply.github.com
          git commit -m 'Regenerate resume README and PDF' -m 'Co-authored-by: hatsunemiku <hatsunemiku@zo.computer>'
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- main.tex scripts .github/workflows/resume.yml; then
            echo 'Resume sources advanced; a newer workflow run will regenerate the files.'
            exit 0
          fi
          git rebase origin/main
          git push origin HEAD:main
